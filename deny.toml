# deny.toml — cargo-deny configuration for the Attestrum workspace.
#
# Enforces the rules in CLAUDE.md §8 and BUILD-PLAN §6.2 across every commit:
#
#   1. License allow-list (Apache-2.0, MIT, BSD-2/3-Clause, MPL-2.0,
#      Unlicense, CC0-1.0, Unicode-3.0 for transitive Unicode-Consortium
#      data tables only). Any new SPDX ID requires founder approval per
#      CLAUDE.md §8 — do not silently expand this list.
#   2. RUSTSEC advisory checks: vulnerabilities + unsound + unmaintained
#      are denied by default in cargo-deny 0.17+ (the explicit per-category
#      knobs were removed in EmbarkStudios/cargo-deny#611). Yanked crates
#      are explicitly denied. To allow a specific advisory ID, add it to
#      `[advisories].ignore` with a comment justifying the exception.
#   3. Source allow-list: only the standard crates.io registry + the
#      explicitly approved git pins per CLAUDE.md §8. Each git pin requires
#      founder approval; the current approved pins:
#        - `Attestrum/sigstore-rs` (Pre-Sprint-5, 2026-05-25) — email-
#          optional patch for workload-identity OIDC tokens. Drop when the
#          upstream PR merges and a sigstore-rs release > 0.14.0 carries
#          the fix.
#        - `hf-hub` per PATH-A-BRIEF Part 2.3 (Sprint 6) — will be added
#          when that crate's upload API stabilizes.
#
# Run locally (rustc 1.85+):
#   cargo install --locked cargo-deny --version "^0.18"
#   cargo deny check --all-features
#
# Note on version pinning: cargo-deny 0.19+ requires rustc 1.88+, which we
# don't have yet (workspace is pinned to 1.85.0 via rust-toolchain.toml).
# 0.18.x is the current sweet spot — handles CVSS 4.0 advisory entries from
# the modern RUSTSEC DB and runs on 1.85+. Sprint 2 E1 originally landed on
# 0.17 (which can't parse CVSS 4.0) when the workspace was on 1.84.0; Sprint
# 2 E2's toolchain bump to 1.85.0 unblocked 0.18.x and the full advisory
# check-list. If 0.17 is still locally installed from E1, upgrade:
#   cargo install --locked --force cargo-deny --version "^0.18"
#
# Run in CI: see .github/workflows/ci.yml → audit job
#   The EmbarkStudios/cargo-deny-action@v2 action downloads its own
#   pre-built cargo-deny binary (latest 0.19.x) that handles CVSS 4.0,
#   so CI runs `cargo deny check --all-features` (all four checks).

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
yanked = "deny"
# Per-advisory ignore list. Each entry is a RUSTSEC ID accepted on
# documented threat-model grounds. Direct deps remain restricted to the
# CLAUDE.md §8 list; this is the audit-side analogue of the [licenses]
# transitive-only exception pattern above. Surface any new ignore to the
# founder before adding — CLAUDE.md §8 governs the dep posture.
ignore = [
    # RUSTSEC-2024-0436: `paste` (proc-macro) marked unmaintained 2024-10-07.
    # `paste` is a popular pure-syntactic proc-macro buried in deep
    # transitive trees (arrow / parquet / sigstore-rs's downstream deps).
    # As a proc-macro it ONLY runs at compile time — no runtime code path,
    # no security/correctness risk to a deployed Attestrum binary. The
    # maintained fork is `pastey`, but upstream migration is out of our
    # control. Industry standard: ignore the advisory + monitor for an
    # actual CVE (which would be a different RUSTSEC ID and would fire
    # independently — `[advisories].ignore` is ID-scoped, not crate-scoped).
    # Founder-approved 2026-05-25 (Sprint 5 carry-forward red triage (a)).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2023-0071: Marvin Attack — RSA timing sidechannel. Affects
    # the `rsa` crate; pulled in transitively via
    # `sigstore` → `rustls` → `rsa`. The attack requires the attacker to
    # observe many decryption timings against a victim holding a
    # long-lived RSA private key.
    #
    # Attestrum's threat model: signing flow uses **ephemeral ed25519**
    # keys issued by Fulcio per signing (Sigstore keyless flow); no
    # long-lived RSA private keys are held by Attestrum or its users.
    # The transitive `rsa` crate is reached only for verification of
    # peer certificates (Fulcio's TLS chain, Rekor's TLS chain), which
    # is public-key cryptography on the verify side — Marvin Attack
    # does not apply to public-key verification. Practical attack
    # surface in Attestrum's flow: near-zero.
    #
    # The `rsa` crate's constant-time fix is in progress upstream but
    # unmerged; we accept the advisory on threat-model grounds rather
    # than vendor-fork. Founder-approved 2026-05-25 (Sprint 5
    # carry-forward red triage (a)).
    "RUSTSEC-2023-0071",
]

[licenses]
# Strict CLAUDE.md §8 allow-list. Apache-2.0 WITH LLVM-exception is the
# stdlib/LLVM-derived variant of Apache-2.0 — semantically equivalent and
# kept on the list to avoid breaking the build on toolchain-adjacent crates.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    # Unicode-3.0 is the Unicode Consortium's data-table license used by
    # `unicode-ident` (transitive via serde_derive). It's OSI-approved and
    # permits commercial use, modification, and redistribution; attribution
    # is the only practical obligation. Added per CLAUDE.md §8 amendment
    # (Sprint 2 E1) — see CLAUDE.md §8's transitive-dep license note.
    "Unicode-3.0",
    # ISC + MIT-0 added at Sprint 4 E3 as transitive-only exceptions for
    # `aws-lc-rs` + `aws-lc-sys` (AWS's C-impl of cryptographic primitives
    # used by rustls, transitively pulled in by sigstore 0.14 → reqwest →
    # rustls). Both are OSI-approved permissive licenses:
    #   ISC ≈ BSD-2-Clause in effect (used by OpenBSD, Postfix, etc.);
    #   MIT-0 = MIT without the attribution clause (strictly MORE permissive
    #          than allow-listed MIT).
    # Same transitive-only exception pattern as Unicode-3.0 — direct deps
    # remain restricted to the CLAUDE.md §8 list. Founder-approved at E3
    # in lieu of switching from rustls to native-tls (which would drag in
    # system OpenSSL with its own cross-platform variance).
    "ISC",
    "MIT-0",
    # Zlib added at Sprint 4 E3 as transitive-only exception for `foldhash`
    # (pulled in by `hashbrown` v0.15+ default-features via newer
    # tokio/sigstore tree). OSI-approved permissive license; functionally
    # similar to BSD-2-Clause + a "do not misrepresent origin" clause.
    "Zlib",
    # CDLA-Permissive-2.0 added at Sprint 4 E3 as transitive-only exception
    # for `webpki-root-certs` (the Mozilla root CA bundle, pulled in by
    # sigstore → rustls-platform-verifier → webpki-roots). Linux Foundation's
    # Community Data License Agreement Permissive 2.0: permits commercial
    # use + modification + redistribution; attribution only obligation.
    # OSI-approved; widely used for distributed data sets like root-CA
    # bundles.
    "CDLA-Permissive-2.0",
    # NCSA added at Sprint 5 S5-D1 E2 as transitive-only exception for
    # `libfuzzer-sys` (pulled in transitively by `image → ravif → rav1e →
    # libfuzzer-sys` even with `image` configured `default-features = false,
    # features = ["png","jpeg","webp","bmp","gif","tiff"]` — `ravif` is part
    # of the cargo graph regardless of the avif feature flag, and its
    # transitive dev-graph reaches libfuzzer-sys). University of Illinois /
    # NCSA Open Source License: OSI-approved + FSF-free + permissive
    # (BSD-3-Clause-equivalent in effect — MIT-style permission grant with
    # an attribution requirement + a no-endorsement clause). Same trust
    # profile as ISC + MIT-0 added at Sprint 4 E3. Direct deps remain
    # restricted to the CLAUDE.md §8 list; this is transitive-only.
    "NCSA",
    # BSL-1.0 added at Sprint 5 S5-D1 E4 as transitive-only exception for
    # `xxhash-rust` v0.8.15 (pulled in via `iscc-lib v0.4.0` for the CDC
    # chunking algorithm underlying the ISCC Data-Code computation per
    # ISO 24138:2024). Boost Software License 1.0: OSI-approved + FSF-free
    # + permissive — strictly MORE permissive than MIT (no attribution
    # required for binary redistribution, only for source distribution).
    # Origin: the C++ Boost project; widely used in the Rust ecosystem
    # (xxhash-rust itself is the pure-Rust port of Cyan4973/xxHash, the
    # canonical fast non-cryptographic hash used by RocksDB, ZFS, etc.).
    # Same transitive-only pattern as NCSA + ISC + MIT-0 + Zlib +
    # CDLA-Permissive-2.0 — direct workspace deps remain restricted to
    # CLAUDE.md §8's base list. Founder-approved 2026-05-25.
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Initially empty. Add specific (crate, version) entries here if an advisory
# database lag means we need to block a known-bad version before it lands in
# RUSTSEC. Surface additions to the founder first.
deny = []
# Intentionally empty. If a dep has a legitimate multi-version situation,
# surface it in a CHANGELOG entry before adding here.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Approved git-pinned sources. Each entry corresponds to a `[patch.crates-io]`
# override in workspace `Cargo.toml` AND a row in `docs/license-inventory.md`
# under "Attestrum-owned forks of external repositories" (forks) or directly
# in the in-use table (direct git pins like `hf-hub`'s pre-release upload API).
#
# Pre-Sprint-5 2026-05-25: `Attestrum/sigstore-rs` added as the FIRST entry —
# our fork carries the `email: Option<String>` patch that makes sigstore-rs's
# `IdentityToken::try_from` work for workload-identity OIDC tokens (GHA,
# GitLab CI, etc.). Drop this entry once the upstream PR merges and a
# sigstore-rs release > 0.14.0 carries the fix; the corresponding
# `[patch.crates-io]` entry in workspace `Cargo.toml` goes away at the same
# time. Founder-approved 2026-05-25 (Sprint 5 Q1 = fix cosign-interop now).
#
# Sprint 5 S5-D3 E2 (2026-05-28): `huggingface/hf-hub` added as the SECOND
# entry. We pin hf-hub master because the upload API (HFRepository::upload_file
# / commit-creation flow) needed by attestrum-publish E3+ hasn't landed on a
# crates.io release yet. Founder-approved 2026-05-28; rev recorded in workspace
# `Cargo.toml` [patch.crates-io] + the in-use table of docs/license-inventory.md.
allow-git = [
    "https://github.com/Attestrum/sigstore-rs",
    "https://github.com/huggingface/hf-hub",
]
