name: ci

# Sprint 1 commit E11 + Sprint 2 commit E1. Jobs:
#   - diagrams: installs Node + mmdc 10.9.1, runs diagram-linter --strict
#               against docs/diagrams.
#   - test:     fmt --check, clippy -D warnings, test --workspace.
#   - audit:    cargo-deny check — license allow-list (CLAUDE.md §8),
#               RUSTSEC advisories, source registry allow-list.
#   - secrets:  secret-scanner --all (CLAUDE.md §0.5 publication-boundary
#               protocol layer 6 — post-push verification that no
#               credential patterns landed even if local hooks were
#               disabled).
#   - cyclonedx: validates the committed cyclonedx.json golden against the
#               public CycloneDX validator (sbom-utility, pinned v0.19.0,
#               checksum-verified) — proves the emitted ML-BOM passes stock
#               tooling 0/0 (CLAUDE.md §12 vendor-neutrality). Decision
#               cyclonedx-mlbom-shape, 2026-05-30. The Croissant validator
#               CI gate remains a separate deferred item.
#
# Determinism matrix (Linux x86 + ARM + macOS + musl) is a separate
# workflow (.github/workflows/determinism.yml) landing in Sprint 2 E3.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    name: diagrams (mermaid + linter)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diagram-linter Check 3 (freshness) needs git history

      # Ubuntu 24.04 ships with `kernel.apparmor_restrict_unprivileged_userns=1`,
      # which blocks Chromium's sandbox (unprivileged user namespaces). mmdc's
      # Puppeteer launches Chromium with the default sandbox, so the diagram
      # render step fails with "Failed to launch the browser process" on this
      # runner image. Standard workaround documented under
      # actions/runner-images#10015 — flip the sysctl OFF for the duration of
      # this job. Safe in CI (ephemeral runner; no persistent attack surface).
      - name: Disable AppArmor unprivileged user namespace restriction
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli (pinned 10.9.1)
        run: npm install -g @mermaid-js/mermaid-cli@10.9.1

      - name: Verify mmdc version
        run: |
          version=$(mmdc --version)
          if [ "$version" != "10.9.1" ]; then
            echo "mmdc version mismatch: expected 10.9.1, got $version" >&2
            exit 1
          fi

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-diagrams-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-diagrams-

      - name: Run diagram-linter
        run: cargo run -p diagram-linter --release --quiet -- check --strict --root docs/diagrams

  test:
    name: test (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  audit:
    name: audit (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  secrets:
    name: secrets (secret-scanner --all)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-secrets-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-secrets-

      # Layer 6 of the CLAUDE.md §0.5 publication-boundary protocol.
      # Re-runs the secret-scanner on the entire working tree as a
      # post-push verification — catches credential patterns that
      # could land if the local .githooks/pre-commit hook was disabled
      # (e.g., a fresh clone without `git config core.hooksPath .githooks`,
      # or a `git commit --no-verify` that violated CLAUDE.md §0.5.4).
      - name: Run secret-scanner --all
        run: cargo run -p secret-scanner --release --quiet -- check --all

  cyclonedx:
    name: cyclonedx (sbom-utility validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Vendor the public CycloneDX validator, pinned to an exact release and
      # verified by its published MD5. v0.19.0 embeds the CycloneDX 1.6 schema,
      # so pinning the binary pins the schema revision (decision I). No Rust /
      # cargo needed — this job validates the committed golden bytes directly.
      - name: Download + verify sbom-utility v0.19.0 (pinned, linux-amd64)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o sbom-utility.tar.gz \
            https://github.com/CycloneDX/sbom-utility/releases/download/v0.19.0/sbom-utility-v0.19.0-linux-amd64.tar.gz
          echo "4d3463c4708b67c64e28a1dfd4e81a8e  sbom-utility.tar.gz" | md5sum -c -
          tar xzf sbom-utility.tar.gz
          ./sbom-utility version

      # The committed golden is the byte-identical emitter output (pinned by the
      # attestrum-emit cyclonedx tests). Validating it proves the bytes we emit
      # pass the public CycloneDX 1.6 schema with zero errors — `validate`
      # exits non-zero on any schema violation.
      - name: Validate cyclonedx.json golden (CycloneDX 1.6, 0 errors)
        run: |
          "$RUNNER_TEMP/sbom-utility" validate \
            -i crates/attestrum-emit/tests/fixtures/cyclonedx-5entry.golden.json
