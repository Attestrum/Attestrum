name: cosign-interop

# Sprint 4 E4.5 — prove a third party with zero Attestrum installed can
# verify our bundles via `cosign verify-blob-attestation --new-bundle-format`
# alone. Closes Sprint 4 acceptance per PATH-A-BRIEF §1.5 caption + Part 6
# Sprint 4 acceptance criterion.
#
# Separate workflow file (NOT a job in ci.yml) so an OIDC- or
# cosign-installer-side failure does not mark the standard test job red.
# The test sits in crates/attestrum-attest/tests/cosign_interop.rs and is
# `#[ignore]`d so `cargo test --workspace` lists but does not execute it;
# this workflow is the only path that runs it under `--include-ignored`.
#
# Trigger cadence: push: branches: [main] only — NO `pull_request` trigger.
# Every successful run leaves one Sigstore public-good Rekor transparency-
# log entry; the push:main-only cadence caps this at ~one entry per merge.
# The Rekor entry's visible content is the workflow URL (GHA OIDC identity),
# the v0.3 predicate URI, and the empty-corpus synthetic manifest's BLAKE3
# hash. No corpus content leaks because the manifest is synthetic.
#
# First GREEN CI run is gated on the founder's first public push to
# `github.com/Attestrum/Attestrum`. Until that push, this workflow does
# not run.

on:
  push:
    branches: [main]

concurrency:
  group: cosign-interop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write    # GHA OIDC token exchange → Fulcio identity proof
  contents: read

jobs:
  cosign-interop:
    name: cosign v2.5+ verify-blob-attestation interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cosign-interop-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cosign-interop-

      # Tactical decision D — belt + suspenders pin. `@v3` is the
      # SIGSTORE/COSIGN-INSTALLER ACTION's major-version pin (NOT the cosign
      # binary version — distinct concept). At 2026-05-25 the latest cosign
      # binary the action installs is v2.5.2; cosign has not shipped a v3.x
      # binary yet (the parked-plan brief assumed v3 existed; first-CI-run
      # caught the assumption). The `--new-bundle-format` flag the test
      # consumes landed in cosign v2.3.0, so v2.5.2 is fully supported. The
      # explicit `cosign version --json` grep below catches binary-version
      # drift outside the v2.x or future v3.x lines.
      - name: Install cosign (sigstore/cosign-installer@v3)
        uses: sigstore/cosign-installer@v3

      - name: Verify installed cosign supports --new-bundle-format (v2.5+ or v3+)
        run: |
          set -euo pipefail
          version_json="$(cosign version --json)"
          echo "$version_json"
          # `cosign version --json` emits camelCase keys (`gitVersion`, not
          # `GitVersion` — the parked-plan brief had the wrong case).
          git_version="$(echo "$version_json" | jq -r '.gitVersion')"
          case "$git_version" in
            v2.[5-9].*|v2.[1-9][0-9].*|v3.*)
              echo "cosign $git_version: OK (>= v2.5 or any v3.x)"
              ;;
            *)
              echo "::error::cosign binary is below v2.5 or unrecognised: $git_version (test requires --new-bundle-format which landed in v2.3.0; pinning >= v2.5 for safety margin)" >&2
              exit 1
              ;;
          esac

      # Exchange the GHA-issued ID-token-request for a sigstore-audience
      # token Fulcio accepts. Audience MUST be `sigstore` (Fulcio's
      # expected audience claim). Mask the token in workflow logs before
      # exporting to subsequent steps via GITHUB_ENV.
      - name: Fetch SIGSTORE_ID_TOKEN via GHA OIDC exchange
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
            | jq -r '.value')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::failed to obtain sigstore-audience OIDC token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SIGSTORE_ID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: cargo test cosign_interop (ignored)
        run: |
          cargo test \
            --workspace \
            --test cosign_interop \
            -- --include-ignored cosign_interop

      # The signed corpus-to-model chain walk (attestrum-bind). Reuses the same
      # SIGSTORE_ID_TOKEN exported above; no cosign binary needed (it verifies
      # via attestrum's own verifier). Proves walk_chain Sigstore-verifies both
      # the binding and corpus bundles and rejects a tampered one (CorpusVerify).
      - name: cargo test chain_walk_signed (ignored)
        run: |
          cargo test \
            -p attestrum-bind \
            --test chain_walk_signed \
            -- --include-ignored chain_walk_signed
