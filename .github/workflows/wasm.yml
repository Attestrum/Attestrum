name: wasm

# C2 (2026-06-06) — the gates that keep attestrum-fingerprint-wasm honest.
# The crate compiles the PROTECTED text-MinHash kernel (CLAUDE.md §4) to
# wasm32-unknown-unknown so the attestrum.com near-match demo runs the IDENTICAL
# Rust in the browser. The two properties that matter for that promise:
#
#   1. REPRODUCIBLE BUILD (same-host) — rebuilding the `wasm-release` artifact
#      on the same toolchain yields byte-identical bytes, so the committed/served
#      `.wasm` can be re-verified. Each host builds it twice and `cmp`s.
#   2. CORRECT OUTPUT (per-host) — the ACTUAL artifact's signatures equal the
#      native kernel's committed golden. A no-dep Node loader
#      (tools/wasm-crosscheck/run.mjs) runs every passage through the real
#      `.wasm` and diffs against tests/golden/minhash-vectors.txt. This is the
#      load-bearing gate (the §4 safeguard for the browser surface): a
#      native-only golden can't catch wasm-codegen / pure-blake3 drift; running
#      the real artifact can.
#
# Both checks run on x86 AND arm, so whichever host builds the shipped artifact,
# it is proven reproducible there and proven to produce the native kernel's
# output. We deliberately do NOT assert the compiled `.wasm` is byte-identical
# ACROSS host architectures: rustc→wasm32 codegen is reproducible per host but
# not bit-identical between an x86 and an arm build host (LLVM instruction
# selection differs), and the product builds the artifact ONCE — so cross-arch
# binary identity is neither required nor achievable. What must be host-
# independent is the OUTPUT, and gate 2 proves that on both arches.
#
# Toolchain pinned to 1.89.0 so "reproducible" is pinned to a known compiler.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_REL_PATH: wasm32-unknown-unknown/wasm-release/attestrum_fingerprint_wasm.wasm

jobs:
  build-verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "linux-x86_64"
            runs-on: ubuntu-24.04
          - label: "linux-aarch64"
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89.0 + wasm32 target
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.label }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-wasm-

      - name: Build the wasm artifact twice (same-host reproducibility)
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/wasm-a" \
            cargo build -p attestrum-fingerprint-wasm \
              --target wasm32-unknown-unknown --profile wasm-release
          CARGO_TARGET_DIR="$RUNNER_TEMP/wasm-b" \
            cargo build -p attestrum-fingerprint-wasm \
              --target wasm32-unknown-unknown --profile wasm-release
          a="$RUNNER_TEMP/wasm-a/$WASM_REL_PATH"
          b="$RUNNER_TEMP/wasm-b/$WASM_REL_PATH"
          if ! cmp -s "$a" "$b"; then
            echo "::error::WASM REPRODUCIBILITY FAILURE: two same-host builds differ on ${{ matrix.label }}"
            ls -la "$a" "$b"
            exit 1
          fi
          echo "OK — same-host byte-identical on ${{ matrix.label }} ($(wc -c < "$a") bytes)"
          cp "$a" "$RUNNER_TEMP/artifact.wasm"

      - name: Cross-check this host's real wasm against the native golden
        run: |
          node tools/wasm-crosscheck/run.mjs "$RUNNER_TEMP/artifact.wasm"
