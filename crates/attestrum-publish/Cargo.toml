[package]
name = "attestrum-publish"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Sprint 5 D3 E1: public API surface lands. PublishTarget trait + three
# impls + PublishPlan/PublishReceipt/AttestrumPublishError. Bodies
# `unimplemented!()` pending E2-E6 real work.
#
# Path-deps:
#   - attestrum-attest: bundle JSON read + Subject + InTotoStatement types
#     for the PublishPlan inputs (bundle_path is consumed by E6).
#   - attestrum-manifest: ManifestStats derivation at E4-E5 (leaf_count,
#     total_bytes, modality histogram) for Croissant + dataset card.
#   - attestrum-emit: this crate calls attestrum-emit at E6 to render
#     croissant.json + README.md + verify.html before uploading to the Hub.
#
# S5-D3 E2: + hf-hub (second approved git-pin in the workspace per
# CLAUDE.md §8; founder approval in E2 commit footer). HuggingFaceTarget::
# new() constructs an HFClientSync at construction time; publish() body
# (create_repo + create_commit via HFRepositorySync) lands at E3-E6.
# Deferred to E3 as dev-dep: wiremock (mock HF server for unit tests).
attestrum-attest   = { path = "../attestrum-attest",   version = "0.0.1" }
attestrum-manifest = { path = "../attestrum-manifest", version = "0.1.0" }
attestrum-emit     = { path = "../attestrum-emit",     version = "0.1.0" }
hf-hub     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

# Sprint 5 D3 E3 (2026-05-28): integration tests for HuggingFaceTarget::publish()
# round-trip a signed bundle through a wiremock-backed mock HF dataset API.
# wiremock is async (tokio listener); HFClientSync's blocking façade runs inside
# the #[tokio::test(flavor = "current_thread")] runtime via internal block_on.
# tempfile builds the per-test fixture roots (TempDir auto-cleans on drop).
# All three are dev-only — not in the runtime binary, not in the public surface.
# wiremock is the first introduction in the workspace (founder-approved 2026-05-28
# per CLAUDE.md §8); tokio + tempfile pre-approved per BUILD-PLAN §6.2 +
# docs/license-inventory.md.
[dev-dependencies]
# S5-D3 E6 (2026-05-28): the publish_commits_six_ops_with_rendered_content
# integration test captures the create_commit NDJSON body, base64-decodes the
# three add_bytes payloads, and asserts byte-equality against the corresponding
# attestrum_emit::render_* outputs. base64 is already a workspace runtime dep
# via attestrum-attest (no new workspace dep introduced); we pull it in as a
# dev-dep here for the test asserter only.
base64   = { workspace = true }
wiremock = "0.6"
tokio    = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
