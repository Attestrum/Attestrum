[package]
name = "attestrum-bind"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Per-commit dep additions per CLAUDE.md §14. Commit 4 (bind): attestrum-attest
# (model-binding predicate types + the canonical attestation-digest helpers +
# Sigstore sign), serde_json (predicate (de)serialize), jiff (bound_at from
# source_date_epoch), thiserror.
# Commit 5 (walk_chain): + attestrum-prove (the signed walk's live membership
# step re-runs prove()).
attestrum-attest = { path = "../attestrum-attest", version = "0.0.1" }
attestrum-prove  = { path = "../attestrum-prove",  version = "0.1.0" }
jiff             = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }

[dev-dependencies]
# Commit 5 walk_chain unsigned soundness fixtures (default suite): build a real
# corpus manifest + RFC 6962 BLAKE3 root so prove() finds/refutes membership.
# attestrum-cas (stream_hash) is for the #[ignore] signed integration test's
# real file digests (manifest + model-weights subject digests).
attestrum-cas      = { path = "../attestrum-cas",      version = "0.1.0" }
attestrum-core     = { path = "../attestrum-core",     version = "0.0.1" }
attestrum-manifest = { path = "../attestrum-manifest", version = "0.1.0" }
attestrum-merkle   = { path = "../attestrum-merkle",   version = "0.1.0" }
base64             = { workspace = true }
regex              = { workspace = true }
