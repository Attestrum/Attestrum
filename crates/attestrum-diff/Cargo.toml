[package]
name = "attestrum-diff"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attestrum-core     = { path = "../attestrum-core", version = "0.0.1" }
attestrum-manifest = { path = "../attestrum-manifest", version = "0.1.0" }
attestrum-merkle   = { path = "../attestrum-merkle", version = "0.1.0" }
# deterministic_json is the one shared canonical-JSON primitive (croissant,
# cyclonedx, verify, and attestrum-decontaminate all use it) — reused here so
# every report's determinism rides one tested implementation, not a private
# copy. (attestrum-cli already carries attestrum-attest, so this adds no new
# transitive weight to the binary.)
attestrum-attest   = { path = "../attestrum-attest", version = "0.0.1" }
serde      = { workspace = true }
serde_json = { workspace = true }
