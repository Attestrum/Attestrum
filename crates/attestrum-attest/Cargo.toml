[package]
name = "attestrum-attest"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attestrum-core = { path = "../attestrum-core", version = "0.0.1" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
schemars   = { workspace = true }
sigstore   = { workspace = true }
# Binding promotion (Commit 1, 2026-05-29): the `attestation_digest_of_bundle`
# helper digests a corpus Statement's canonical-JSON / DSSE-payload bytes with
# BLAKE3 + SHA-256 (the DigestMap pair). Both crates are already in
# [workspace.dependencies] and the license inventory (Sprint 2 E5); this is a
# transitive→direct graph-promotion, the same pattern attestrum-cli (E3.5) and
# attestrum-prove (S5-D2 E7) already used. No new external dep.
blake3     = { workspace = true }
sha2       = { workspace = true }
# Sprint 4 E4: cert parsing for the identity extractor + regex for
# cosign-compatible identity-policy matching + base64 for decoding
# bundle.verificationMaterial.certificate.rawBytes.
x509-cert  = { workspace = true }
regex      = { workspace = true }
base64     = { workspace = true }

# Sprint 4 E4.5: dev-only deps for the `cosign verify-blob-attestation`
# interop test (`tests/cosign_interop.rs`). All three are existing
# workspace members already used elsewhere in the workspace; pulling them
# in as dev-deps lets the interop test exercise the production sign path
# end-to-end (build a real empty-corpus manifest.parquet via the same
# `attestrum_pipeline::build_corpus` the CLI consumes, hash it via the
# same `attestrum_cas::stream_hash` the CLI consumes, sign it via this
# crate's `sign`, self-verify via `verify`, then shell out to cosign).
# No new license-inventory rows: these are workspace members, not
# externally-published crates.
[dev-dependencies]
attestrum-core     = { path = "../attestrum-core", version = "0.0.1" }
attestrum-cas      = { path = "../attestrum-cas", version = "0.1.0" }
attestrum-pipeline = { path = "../attestrum-pipeline", version = "0.1.0" }
