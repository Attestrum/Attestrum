[package]
name = "attestrum-prove"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Per-E-commit dep additions per CLAUDE.md §14 (eager-generalization
# anti-pattern). Each E-commit adds only what its newly-shipped code
# consumes; hf-hub + url remain deferred to E7.
#
# E1: attestrum-core, attestrum-attest, attestrum-fingerprint, serde,
#     thiserror (public API surface + smoke tests).
# E2: + attestrum-manifest, attestrum-merkle, serde_json (local-Parquet
#     manifest read + RFC 6962 Merkle-root recompute + predicate
#     JSON-serialization for the in-toto Statement wrapping).
# E4: + attestrum-cas, jiff (corpus-bundle BLAKE3+SHA-256 digest via
#     stream_hash_path for predicate.corpus.attestation_digest; RFC 3339
#     proof_generated_at timestamp from opts.source_date_epoch).
# E5: + iscc-lib, image (ISCC composite-distance via iscc_decode on the
#     hashes inside each FingerprintBundle; image::guess_format for the
#     Document dispatcher's MIME detection; CAS re-fingerprint at prove
#     time so manifest leaves don't need pre-computed fuzzy hashes).
# E7: + reqwest, sha2 (HuggingFace + URL manifest fetch via reqwest's
#     blocking client; sha2 hashes the source descriptor — "huggingface:
#     <repo>@<revision>" or "url:<url>" — to a per-source cache key
#     directory under <workspace>/prove/manifest-cache/). reqwest is
#     promoted from sigstore-transitive to direct workspace dep at the
#     graph level — zero new external transitive crates. sha2 is
#     graph-promoted from attestrum-cas-transitive to attestrum-prove-
#     direct (it's already a workspace dep + an attestrum-cas /
#     attestrum-cli direct dep per docs/license-inventory.md).
# S5-D3 E2: + hf-hub (closes D3 refactor debt). Replaces D2 E7's inline
#     hf_auth_header() + build_hf_url() with HFClientSync.dataset().
#     download_file() for ManifestSource::HuggingFace. ManifestSource::Url
#     continues using reqwest::blocking. hf-hub owns the HF Hub auth chain
#     (env HF_TOKEN → HF_TOKEN_PATH → $HF_HOME/token), richer than E7's
#     env-only logic. Second approved workspace git-pin per CLAUDE.md §8.
attestrum-core         = { path = "../attestrum-core",         version = "0.0.1" }
attestrum-attest       = { path = "../attestrum-attest",       version = "0.0.1" }
attestrum-fingerprint  = { path = "../attestrum-fingerprint",  version = "0.1.0" }
attestrum-manifest     = { path = "../attestrum-manifest",     version = "0.1.0" }
attestrum-merkle       = { path = "../attestrum-merkle",       version = "0.1.0" }
attestrum-cas          = { path = "../attestrum-cas",          version = "0.1.0" }
hf-hub                 = { workspace = true }
iscc-lib               = { workspace = true }
image                  = { workspace = true }
jiff                   = { workspace = true }
reqwest                = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
sha2                   = { workspace = true }
thiserror              = { workspace = true }
