[package]
name = "attestrum-pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attestrum-core     = { path = "../attestrum-core",     version = "0.0.1" }
attestrum-cas      = { path = "../attestrum-cas",      version = "0.1.0" }
attestrum-manifest = { path = "../attestrum-manifest", version = "0.1.0" }
attestrum-merkle   = { path = "../attestrum-merkle",   version = "0.1.0" }
rayon          = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
# Integration tests in tests/ are compiled as separate binaries and do NOT
# auto-inherit the crate's regular deps. Restated here so the test files can
# call blake3::hash and attestrum_core::hex::encode_32 directly when verifying
# CAS paths, and so they can use the manifest reader for round-trip checks.
attestrum-core     = { path = "../attestrum-core",     version = "0.0.1" }
attestrum-cas      = { path = "../attestrum-cas",      version = "0.1.0" }
attestrum-manifest = { path = "../attestrum-manifest", version = "0.1.0" }
attestrum-merkle   = { path = "../attestrum-merkle",   version = "0.1.0" }
blake3         = { workspace = true }
# Lookback seal generator: examples/wikitext/seal.rs (shared by the
# seal-wikitext example and tests/wikitext_seal.rs) reads the WikiText-103
# `text` column from Parquet and defines a thiserror error type. Integration
# tests don't inherit the crate's normal deps, so thiserror is restated here;
# arrow/parquet are dev-only (the library stays Parquet-free). Same
# workspace-pinned versions attestrum-manifest already uses.
arrow          = { workspace = true }
# `snap` feature added on top of the workspace's `arrow + zstd`: the
# HF-published WikiText-103 shards are Snappy-compressed (Parquet's default),
# so the seal reader must decompress snappy. Reader-only — does NOT change the
# attestrum-manifest zstd-level-3 writer (CLAUDE.md §4/§7 determinism).
parquet        = { workspace = true, features = ["snap"] }
thiserror      = { workspace = true }
