[package]
name = "attestrum-fingerprint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attestrum-core = { path = "../attestrum-core", version = "0.0.1" }
# PROTECTED text-MinHash kernel (normalize_text + minhash::compute), extracted
# for byte-identical wasm reuse (§4 — approved 2026-06-06). Consumed by the
# fingerprint_text path; this crate keeps blake3 + unicode-normalization for its
# own BLAKE3 document hashing + nfc_char_count.
attestrum-text-minhash = { path = "../attestrum-text-minhash", version = "0.1.0" }
blake3                = { workspace = true }
sha2                  = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
thiserror             = { workspace = true }
unicode-normalization = { workspace = true }
jiff                  = { workspace = true }
# Sprint 5 S5-D1 E2: image decode + two perceptual hashes (pHash + blockhash).
image        = { workspace = true }
image_hasher = { workspace = true }
blockhash    = { workspace = true }
# Sprint 5 S5-D1 E4: ISCC composition (ISO 24138:2024) via iscc-lib 0.4.
# PROTECTED — see crate-level docs.
iscc-lib     = { workspace = true }
# Sprint 5 S5-D1 E5: JsonSchema derives on FingerprintBundle + nested types
# so the canonical schema published at attestrum.com/fingerprint/v0.1.schema.json
# is generated directly from the Rust types via the schemars derive macro.
# Paired with the attestrum_core::Modality JsonSchema derive that lands in
# the same commit (resolves the Modality field's enum shape transitively).
schemars     = { workspace = true }
